name: Generate GitHub metrics

# Replaces the old github-readme-stats / streak-stats / profile-trophy
# widgets (all free, shared, third-party endpoints that regularly go
# down or get rate-limited). This workflow renders the same kind of
# information — stats, top languages, and earned achievements — as a
# static SVG *we own*, using lowlighter/metrics, and commits it to the
# `output` branch next to the contribution snake.
#
# Requires a repo secret named METRICS_TOKEN — see SETUP.md, step 3.

on:
  schedule:
    - cron: "30 3 * * *"   # daily, offset from the snake workflow
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: bkushagra742
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          config_timezone: Asia/Kolkata
          committer_branch: output
