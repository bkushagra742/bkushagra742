<svg width="100%" height="100%" viewBox="0 0 1280 96" fill="none"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="footTitleD">
  <title id="footTitleD">Footer — designed and built by Kushagra</title>

  <style>
    .sans { font-family: -apple-system, "SF Pro Display", "Segoe UI", Inter, ui-sans-serif, system-ui, sans-serif; }
    .pulse { animation: pulse 6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none !important; opacity: .8 !important; }
    }
  </style>

  <line x1="64" y1="0" x2="1216" y2="0" stroke="rgba(255,255,255,0.08)"/>

  <circle class="pulse" cx="66" cy="48" r="3" fill="#3B82F6"/>
  <text class="sans" x="82" y="52" font-size="12.5" fill="#A3A3A3">Designed &amp; built by Kushagra · Turning Ideas Into Software</text>

  <text class="sans" x="1216" y="52" text-anchor="end" font-size="12.5" fill="#525252">Ujjain, India</text>
</svg>
